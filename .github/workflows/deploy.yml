name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo se publica desde un push (o ejecución manual) en main. Ojo: en un pull_request que ya
# quedó fusionado, github.ref vale refs/heads/main, así que no basta con mirar la rama.
env:
  PUBLICAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  # Una publicación en curso nunca se cancela; las verificaciones de PR sí.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: env.PUBLICAR == 'true'
        with:
          path: dist

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:firestore

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, pruebas]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
